<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 650" width="390" height="650" font-family="-apple-system, 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <pattern id="floor" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#eee9df"/>
      <path d="M0 26H26V0" fill="none" stroke="#e3ddd0"/>
    </pattern>
    <g id="desk">
      <rect x="-34" y="0" width="68" height="24" rx="5" fill="#c9b7a2" stroke="#9a8469"/>
      <rect x="-14" y="-16" width="28" height="17" rx="3" fill="#344256"/>
      <path d="M-5 4H5" stroke="#64748b" stroke-width="3"/>
    </g>
  </defs>
  <rect width="390" height="650" fill="url(#floor)"/>
  <!-- 사장실과 결재 대기줄 -->
  <rect x="12" y="12" width="366" height="170" rx="12" fill="#fbf2e4" stroke="#ad8b61" stroke-width="2"/>
  <text x="40" y="36" font-size="13" fill="#795a35" font-weight="700">사장실</text>
  <rect x="35" y="58" width="90" height="29" rx="5" fill="#916b47"/>
  <rect x="48" y="48" width="27" height="20" rx="3" fill="#344256"/>
  <rect x="91" y="69" width="23" height="9" rx="2" fill="#d5ba7a"/>
  <text x="245" y="70" text-anchor="middle" font-size="11" fill="#957249">결재 대기줄</text>
  <path d="M53 172H315" stroke="#c6ab86" stroke-dasharray="4 5"/>
  <!-- 총괄실: 메인 세션 책상 여섯 개와 서브에이전트 -->
  <rect x="12" y="194" width="236" height="320" rx="12" fill="#edf2fa" stroke="#7594be" stroke-width="2"/>
  <text x="30" y="217" font-size="13" fill="#45658f" font-weight="700">총괄실</text>
  <text x="229" y="216" text-anchor="end" font-size="9" fill="#6e84a2">Claude · 서브</text>
  <use href="#desk" x="85.8" y="281"/><use href="#desk" x="191.1" y="281"/>
  <use href="#desk" x="85.8" y="372"/><use href="#desk" x="191.1" y="372"/>
  <use href="#desk" x="85.8" y="463"/><use href="#desk" x="191.1" y="463"/>
  <!-- 전담 팀원은 쉬는 동안에도 자기 방에 머문다. -->
  <rect x="262" y="194" width="116" height="102" rx="12" fill="#e8f3ec" stroke="#85a78f" stroke-width="2"/>
  <text x="276" y="214" font-size="12" fill="#507b5b" font-weight="700">개발실</text>
  <use href="#desk" x="315.9" y="281"/>
  <rect x="262" y="306" width="116" height="102" rx="12" fill="#f2edfa" stroke="#a698be" stroke-width="2"/>
  <text x="276" y="326" font-size="12" fill="#77628f" font-weight="700">검토실</text>
  <use href="#desk" x="315.9" y="385"/>
  <rect x="262" y="418" width="116" height="96" rx="12" fill="#e8f4f5" stroke="#85aaae" stroke-width="2"/>
  <text x="276" y="438" font-size="12" fill="#507d82" font-weight="700">웹데스크</text>
  <use href="#desk" x="315.9" y="489"/>
  <!-- 쉬는 Claude 세션을 위한 라운지 -->
  <rect x="12" y="526" width="366" height="112" rx="12" fill="#e6eee4" stroke="#8ba285" stroke-width="2"/>
  <text x="30" y="547" font-size="13" fill="#587350" font-weight="700">라운지</text>
  <text x="357" y="546" text-anchor="end" font-size="10" fill="#7a9073">쉬는 세션</text>
  <rect x="40" y="608" width="298" height="20" rx="8" fill="#88a37f"/>
  <rect x="40" y="602" width="298" height="12" rx="6" fill="#a5bb9c"/>
</svg>
