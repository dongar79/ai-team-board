<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" width="390" height="520" font-family="-apple-system, 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <!-- 바닥 -->
  <rect width="390" height="520" fill="#e9e4d8"/>
