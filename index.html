<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI팀 사무실</title>
  <meta name="theme-color" content="#2b2f3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI팀 사무실">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="groups.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="reports.css">
</head>
<body>
  <section id="login-screen" class="login-screen" aria-labelledby="login-title">
    <div class="login-mark" aria-hidden="true">🔐</div>
    <h1 id="login-title">AI팀 사무실</h1>
    <p>사장님만 볼 수 있는 업무 상황판입니다.</p>
    <p id="login-email" class="login-email">허용 이메일 등록 대기</p>
    <button id="login-send" class="login-button" type="button" disabled>사장님 이메일로 로그인 링크 받기</button>
    <p id="login-status" class="login-status" role="status" aria-live="polite">로그인 설정을 확인하고 있습니다.</p>
    <a href="?demo=1">데모 보기</a>
  </section>
  <button id="logout" class="logout" type="button" hidden>로그아웃</button>
  <div id="board-app" hidden>
  <header class="top">
    <div class="title">AI팀 사무실 <span id="conn" class="dot" title="연결 상태"></span></div>
    <div class="counts">
      <span class="c working">일 <b id="n-working">0</b></span>
      <button class="c question" type="button" data-reportbox>질문 <b id="n-question">0</b></button>
      <button class="c approval" type="button" data-reportbox>결재 <b id="n-approval">0</b></button>
      <button class="c report" type="button" data-reportbox>보고 <b id="n-report">0</b></button>
    </div>
    <button id="wake" class="wake" type="button" title="화면이 꺼지지 않게 합니다">화면 켜둠 ○</button>
  </header>
  <div id="summary" class="summary" aria-live="polite">오늘 요약 · 활동 기록을 확인하고 있습니다</div>
  <main class="office" id="office" aria-label="팀원 배치">
    <img class="bg" src="office.svg" alt="사장실, 총괄실, 개발실, 검토실, 웹데스크와 라운지" draggable="false">
    <svg id="links" class="links" aria-label="위임 관계"></svg>
    <button id="boss" class="boss" type="button" aria-label="사장실 보고함 열기"></button>
    <div id="chars" class="chars"></div>
    <div id="task-bubble" class="task-bubble" role="status" aria-live="polite" hidden></div>
  </main>
  <section class="info" id="info" aria-label="선택한 팀원">
    <div class="info-name" id="info-name">캐릭터를 누르면 작업 내용이 보입니다</div>
    <div class="info-role" id="info-role"></div>
    <div class="info-task" id="info-task"></div>
    <div class="info-note" id="info-note"></div>
    <div class="info-meta" id="info-origin"></div>
    <div class="info-meta" id="info-parent"></div>
    <div class="info-meta" id="info-host"></div>
    <div class="info-meta" id="info-project"></div>
    <div class="info-wait" id="info-wait"></div>
    <div id="info-reviews"></div>
    <div id="info-threads"></div>
  </section>
  <section class="section" aria-labelledby="sessions-title">
    <h2 id="sessions-title">그룹 담당 <span id="session-count">0</span></h2>
    <p class="hint">최근 12시간 · 결재, 질문, 완료 보고, 일, 쉼 순 · 누르면 쓰레드 펼침</p>
    <div id="sessions" class="sessions"></div>
  </section>
  <div id="notice" class="notice" hidden></div>
  <section class="section" aria-labelledby="activity-title">
    <h2 id="activity-title">최근 활동</h2>
    <p id="activity-status" class="hint">최근 20건 · 한국 시간</p>
    <ol id="timeline" class="timeline"></ol>
  </section>
  <section id="demo" class="demo" hidden>
    <div class="demo-title">데모 모드 · 실제 연결 없음</div>
    <div class="demo-row">
      <button data-agent="main:demo0001" data-status="working">메인 일함</button>
      <button data-agent="main:demo0001" data-status="question">메인 질문</button>
      <button data-agent="main:demo0001" data-status="approval">메인 결재</button>
      <button data-agent="main:demo0001" data-status="idle">메인 쉼</button>
      <button data-agent="main:demo0001" data-status="report">완료 보고</button>
    </div>
    <div class="demo-row">
      <button data-agent="sub:demo0001:aaaa1111" data-status="working">서브 일함</button>
      <button data-agent="sub:demo0001:aaaa1111" data-status="idle">서브 쉼</button>
      <button data-agent="gpt" data-status="idle">GPT 쉼</button>
      <button data-agent="gpt" data-status="working">GPT 일함</button>
      <button data-old="1">대기 7분으로</button>
    </div>
  </section>
  <footer class="footer">보기 전용 · <a href="?demo=1">데모 보기</a></footer>
  </div>
  <script src="config.js"></script>
  <script src="model.js"></script>
  <script src="characters.js"></script>
  <script src="reviews.js"></script>
  <script src="reportbox.js"></script>
  <script src="office.js"></script>
  <script src="panel.js"></script>
  <script src="data.js"></script>
  <script src="demo.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
